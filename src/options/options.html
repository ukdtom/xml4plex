<!DOCTYPE html>
<html lang="en" style="height:400px; width:800px">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="options.css">
        <link rel="stylesheet" href="../shared/Multiselect/MultiSelect.min.css">
        <title>XML4Plex Options</title>
    </head>
    <body>
        <h1>Option page for xml4Plex</h1>
        <div class="options">
            <div class="resolution">
                <label for="resolution">Choose a resolution to autoselect if present:</label>
                <select name="resolution" id="resolution">
                    <option value="720">720p</option>
                    <option value="1080">1080p</option>
                    <option value="4k">4K</option>
                </select>
                <br>
                <label for="resolutionMax">Choose the maximum resolution to download if we can not autoselect:</label>
                <select name="resolutionMax" id="resolutionMax">
                    <option value="720">720p</option>
                    <option value="1080">1080p</option>
                    <option value="4k">4K</option>
                </select>
                <br>
                <label for="resolutionMin">Choose the minimum resolution to download if we can not autoselect:</label>
                <select name="resolutionMin" id="resolutionMin">
                    <option value="720">720p</option>
                    <option value="1080">1080p</option>
                    <option value="4k">4K</option>
                </select>
            </div>
            <br>
            <div class="subs">
                <p>Select the subtitle languages that always will be added to the download queue if present as external subtitles</p>
                <select id="subs" name="subs" multiple></select>
            </div>
        </div>
        <div class="footer">
            <button type="button" id="btnSave">Save Options</button>
        </div>
    </body>
    <script type="module" src="options.js"></script>
</html>
